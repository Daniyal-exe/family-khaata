<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khaata — Reports</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="logo-icon-lg">🏠</div>
  <div style="color:var(--text-muted);font-size:14px">Loading...</div>
</div>

<div class="app-layout" id="appLayout" style="display:none">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">🏠</div>
        <span><b>Khaata</b></span>
      </div>
    </div>
    <div class="home-badge">
      <div class="hb-label">Family Home</div>
      <div class="hb-name" id="homeBadgeName">Loading...</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu</div>
      <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" href="expenses.html"><span class="nav-icon">📋</span> All Expenses</a>
      <a class="nav-item active" href="reports.html"><span class="nav-icon">📄</span> Reports</a>
      <div class="nav-section-label" style="margin-top:20px">Home</div>
      <div class="nav-item" onclick="showJoinCode()"><span class="nav-icon">🔑</span> Show Join Code</div>
    </nav>
    <div class="sidebar-footer">
      <div class="dropdown" id="userDropdown">
        <button class="user-profile-btn" onclick="toggleDropdown()">
          <div class="avatar" id="userAvatarSidebar">?</div>
          <div class="user-info">
            <div class="u-name" id="userNameSidebar">Loading...</div>
            <div class="u-role">Member</div>
          </div>
        </button>
        <div class="dropdown-menu" id="dropdownMenu" style="display:none">
          <div class="dropdown-item" onclick="toggleTheme()">🌙 Toggle Theme</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item danger" onclick="signOut()">🚪 Logout</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="openSidebar()">☰</button>
        <span class="topbar-title">Reports</span>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </header>

    <main class="page-content">

      <!-- Year selector -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
        <div>
          <h1 style="font-size:22px;margin-bottom:4px">Monthly Reports</h1>
          <p style="color:var(--text-secondary);font-size:14px">Download or view reports by month.</p>
        </div>
        <select class="filter-select" id="yearSelect" onchange="loadYear()" style="font-weight:700;font-size:15px;padding:10px 16px"></select>
      </div>

      <!-- Month Grid -->
      <div id="monthGrid" class="month-grid">
        <div class="spinner-center"><div class="spinner spinner-dark"></div></div>
      </div>

      <!-- Selected Month Report -->
      <div id="reportSection" style="display:none;margin-top:28px">
        <div class="card">
          <div class="card-header">
            <span class="card-title" id="reportTitle">Report</span>
            <div style="display:flex;gap:8px">
              <button class="btn btn-secondary btn-sm" onclick="downloadCSVReport()">📊 Download CSV</button>
              <button class="btn btn-primary btn-sm" onclick="downloadPDFReport()">📄 Download PDF</button>
            </div>
          </div>
          <div class="card-body">

            <!-- Report Stats -->
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px" id="reportStats"></div>

            <!-- Chart -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px" id="reportCharts">
              <div>
                <div style="font-weight:700;font-size:14px;margin-bottom:12px">Category Breakdown</div>
                <div style="height:200px"><canvas id="reportCatChart"></canvas></div>
              </div>
              <div id="reportCatTable"></div>
            </div>

            <!-- Expense table -->
            <div style="font-weight:700;font-size:14px;margin-bottom:12px">All Expenses</div>
            <div style="overflow-x:auto">
              <table style="width:100%;border-collapse:collapse;font-size:13px" id="reportTable">
                <thead>
                  <tr style="background:var(--bg-input)">
                    <th style="padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Date</th>
                    <th style="padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Item</th>
                    <th style="padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Category</th>
                    <th style="padding:10px 12px;text-align:right;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Amount</th>
                    <th style="padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Added By</th>
                  </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Join Code Modal -->
<div class="modal-overlay" id="joinCodeModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h3 class="modal-title">Family Join Code</h3>
      <button class="modal-close" onclick="document.getElementById('joinCodeModal').style.display='none'">✕</button>
    </div>
    <div class="join-code-display">
      <div class="code" id="joinCodeDisplay">------</div>
    </div>
    <button class="btn btn-secondary btn-full" style="margin-top:12px" onclick="navigator.clipboard.writeText(homeData?.join_code||'');toast.success('Copied!')">📋 Copy</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/home.js"></script>
<script src="js/expenses.js"></script>
<script src="js/reports.js"></script>
<script>
let currentUser = null, homeData = null;
let selectedMonthExpenses = [], selectedMonthLabel = '';
let reportCatChart = null;

(async () => {
  const user = await requireAuth();
  if (!user) return;
  currentUser = user;
  const homeId = await checkWorkspace(user.id);
  if (!homeId) { window.location.href = 'workspace.html'; return; }
  homeData = await getHome(homeId);
  document.getElementById('homeBadgeName').textContent = homeData.home_name;
  document.getElementById('userAvatarSidebar').textContent = initials(user.user_metadata?.name || user.email);
  document.getElementById('userNameSidebar').textContent = user.user_metadata?.name || user.email.split('@')[0];

  // Populate year dropdown (past 3 years)
  const currentYear = new Date().getFullYear();
  const yearSel = document.getElementById('yearSelect');
  for (let y = currentYear; y >= currentYear - 2; y--) {
    yearSel.innerHTML += `<option value="${y}">${y}</option>`;
  }

  await loadYear();

  document.getElementById('pageLoader').style.display = 'none';
  document.getElementById('appLayout').style.display = 'flex';
})();

async function loadYear() {
  const year = document.getElementById('yearSelect').value;
  const summary = await getMonthlySummary(homeData.id, year);
  renderMonthGrid(summary, year);
  document.getElementById('reportSection').style.display = 'none';
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderMonthGrid(summary, year) {
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = MONTH_NAMES.map((name, i) => {
    const key = `${year}-${String(i+1).padStart(2,'0')}`;
    const data = summary[key];
    return `
      <div class="month-card" onclick="loadMonthReport('${key}', '${name} ${year}')">
        <div class="m-name">${name}</div>
        ${data
          ? `<div class="m-total">${formatPKR(data.total)}</div>
             <div class="m-count">${data.count} expense${data.count!==1?'s':''}</div>`
          : `<div class="m-count" style="margin-top:6px;font-size:12px">No data</div>`}
      </div>`;
  }).join('');
}

async function loadMonthReport(ym, label) {
  selectedMonthLabel = label;
  document.getElementById('reportTitle').textContent = `📄 ${label} — ${homeData.home_name}`;
  document.getElementById('reportSection').style.display = 'block';
  document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

  document.getElementById('reportTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted)"><div style="display:inline-block" class="spinner spinner-dark"></div></td></tr>';

  selectedMonthExpenses = await getExpensesByMonth(homeData.id, ym);

  const total = selectedMonthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const highest = selectedMonthExpenses.length ? Math.max(...selectedMonthExpenses.map(e=>Number(e.amount))) : 0;
  const catTotals = {};
  selectedMonthExpenses.forEach(e => { catTotals[e.category] = (catTotals[e.category]||0)+Number(e.amount); });
  const topCat = Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];

  // Stats
  document.getElementById('reportStats').innerHTML = `
    <div style="background:var(--accent-soft);border:1px solid var(--accent-light);border-radius:var(--radius-md);padding:14px">
      <div style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Total Spent</div>
      <div style="font-size:20px;font-weight:800;margin-top:4px">${formatPKR(total)}</div>
    </div>
    <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Expenses</div>
      <div style="font-size:20px;font-weight:800;margin-top:4px">${selectedMonthExpenses.length}</div>
    </div>
    <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Highest</div>
      <div style="font-size:20px;font-weight:800;margin-top:4px">${formatPKR(highest)}</div>
    </div>
    <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.05em">Top Category</div>
      <div style="font-size:16px;font-weight:800;margin-top:4px">${topCat ? getCat(topCat[0]).label : '—'}</div>
    </div>`;

  // Category chart
  const labels=[], data=[], colors=[];
  Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).forEach(([catId, amt])=>{
    const cat=getCat(catId); labels.push(cat.label); data.push(amt); colors.push(cat.color);
  });
  if (reportCatChart) reportCatChart.destroy();
  reportCatChart = new Chart(document.getElementById('reportCatChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth:0 }] },
    options: { responsive:true, maintainAspectRatio:false, cutout:'60%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx=>` ${formatPKR(ctx.raw)}` } } } }
  });

  // Category table
  document.getElementById('reportCatTable').innerHTML = `
    <div style="font-weight:700;font-size:14px;margin-bottom:12px">By Category</div>
    ${Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([catId, amt])=>{
      const cat=getCat(catId);
      const pct = total>0 ? Math.round(amt/total*100) : 0;
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:18px">${cat.icon}</span>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${cat.label}</div>
          <div style="background:var(--border);height:4px;border-radius:4px;margin-top:4px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${cat.color};border-radius:4px"></div>
          </div>
        </div>
        <div style="text-align:right;font-size:13px;font-weight:700">${formatPKR(amt)}</div>
      </div>`;
    }).join('')}`;

  // Expense table
  document.getElementById('reportTableBody').innerHTML = selectedMonthExpenses.length
    ? selectedMonthExpenses.map(e => {
        const cat=getCat(e.category);
        return `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:10px 12px;color:var(--text-secondary)">${formatDate(e.date)}</td>
          <td style="padding:10px 12px;font-weight:600">${e.item_name}</td>
          <td style="padding:10px 12px"><span class="cat-badge">${cat.icon} ${cat.label}</span></td>
          <td style="padding:10px 12px;text-align:right;font-weight:700">${formatPKR(e.amount)}</td>
          <td style="padding:10px 12px;color:var(--text-secondary)">${e.users?.name || '—'}</td>
        </tr>`;
      }).join('') + `<tr style="background:var(--accent-soft)">
        <td colspan="3" style="padding:10px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.05em">Total</td>
        <td style="padding:10px 12px;text-align:right;font-weight:800;font-size:15px;color:var(--accent)">${formatPKR(total)}</td>
        <td></td></tr>`
    : `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">No expenses for this month.</td></tr>`;
}

function downloadCSVReport() {
  downloadCSV(selectedMonthExpenses, selectedMonthLabel, homeData.home_name);
}

function downloadPDFReport() {
  downloadPDF(selectedMonthExpenses, selectedMonthLabel, homeData.home_name);
}

function showJoinCode() {
  document.getElementById('joinCodeDisplay').textContent = homeData?.join_code || '------';
  document.getElementById('joinCodeModal').style.display = 'flex';
}

function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('visible'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('visible'); }
function toggleDropdown() { const m=document.getElementById('dropdownMenu'); m.style.display=m.style.display==='none'?'block':'none'; }
document.addEventListener('click', e => { const dd=document.getElementById('userDropdown'); if(dd&&!dd.contains(e.target)) document.getElementById('dropdownMenu').style.display='none'; });
</script>
</body>
</html>
