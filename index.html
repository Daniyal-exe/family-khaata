<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khaata — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon"><i class="ri-home-4-line" aria-hidden="true"></i></div>
      <span><b>Khaata</b> App</span>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-switcher" id="authTabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <h2 class="auth-title">Welcome back!</h2>
      <p class="auth-subtitle">Login to manage your family expenses.</p>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" required>
      </div>
      <div class="form-group password-field">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="••••••••" required>
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword('loginPassword', this)">
            <i class="ri-eye-line" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" onclick="handleLogin()" id="loginBtn">
        <span id="loginBtnText">Login</span>
        <span id="loginSpinner" style="display:none"><span class="spinner"></span></span>
      </button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none">
      <h2 class="auth-title">Create account</h2>
      <p class="auth-subtitle">Set up your family expense tracker.</p>

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="signupName" placeholder="e.g. Ahmed Khan" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@email.com" required>
      </div>
      <div class="form-group password-field">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupPassword" placeholder="Min. 6 characters" required>
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword('signupPassword', this)">
            <i class="ri-eye-line" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" onclick="handleSignup()" id="signupBtn">
        <span id="signupBtnText">Create Account</span>
        <span id="signupSpinner" style="display:none"><span class="spinner"></span></span>
      </button>
    </div>

  </div>

  <!-- Theme toggle (floating) -->
  <button class="theme-toggle" onclick="toggleTheme()"
    style="position:fixed;top:20px;right:20px;z-index:10"><i class="ri-moon-line" aria-hidden="true"></i></button>

  <style>
    /* Login page specific styles for responsive layout and password toggle */
    .auth-card { max-width:420px; width:100%; margin:48px auto; padding:28px; box-sizing:border-box; }
    .password-wrapper { position:relative; }
    .password-wrapper input { padding-right:44px; }
    .password-toggle { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none;border:0;padding:6px;cursor:pointer;color:var(--text-muted);font-size:18px }
    @media (max-width:480px) {
      .auth-card { margin:20px; padding:18px; }
      .auth-logo { display:flex; align-items:center; gap:8px; }
      .auth-title { font-size:20px }
      .auth-subtitle { font-size:13px }
      .tab-switcher { display:flex; gap:8px; }
      .btn.btn-full { padding:10px 12px }
    }
  </style>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, go to dashboard
    (async () => { await checkAuthRedirect(); })();

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { toast.warning('Please fill in all fields.'); return; }

      setLoading('login', true);
      try {
        await signIn(email, password);
        toast.success('Welcome back!');
        setTimeout(() => window.location.href = 'dashboard.html', 500);
      } catch (err) {
        toast.error(err.message || 'Login failed. Check your credentials.');
      } finally {
        setLoading('login', false);
      }
    }

    async function handleSignup() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      if (!name || !email || !password) { toast.warning('Please fill in all fields.'); return; }
      if (password.length < 6) { toast.warning('Password must be at least 6 characters.'); return; }

      setLoading('signup', true);
      try {
        await signUp(name, email, password);
        toast.success('Account created! Please check your email to confirm, then login.');
        setTimeout(() => switchTabById('login'), 2000);
      } catch (err) {
        toast.error(err.message || 'Signup failed. Please try again.');
      } finally {
        setLoading('signup', false);
      }
    }

    function switchTabById(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', (tab==='login' && i===0) || (tab==='signup' && i===1));
      });
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    function setLoading(form, loading) {
      document.getElementById(`${form}BtnText`).style.display = loading ? 'none' : 'inline';
      document.getElementById(`${form}Spinner`).style.display = loading ? 'inline-flex' : 'none';
      document.getElementById(`${form}Btn`).disabled = loading;
    }

    function togglePassword(inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        if (icon) { icon.classList.remove('ri-eye-line'); icon.classList.add('ri-eye-off-line'); }
      } else {
        inp.type = 'password';
        if (icon) { icon.classList.remove('ri-eye-off-line'); icon.classList.add('ri-eye-line'); }
      }
    }

    // Allow Enter key on inputs
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const loginVisible = document.getElementById('loginForm').style.display !== 'none';
        loginVisible ? handleLogin() : handleSignup();
      }
    });
  </script>
</body>
</html>
